<style>
        body {
            background-color: #f7f9fb;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {

<body class="bg-background text-on-background">
<div class="app-container flex flex-col">
<!-- Top Navigation Bar -->

<div class="flex justify-between items-center px-4 py-4 max-w-container-max mx-auto">
<div class="flex items-center gap-3">

</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:text-primary transition-all">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
<div class="w-8 h-8 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant">

</div>
</div>
</div>
</header>
<!-- Main Content Area (Scrollable) -->
<main class="flex-1 overflow-y-auto px-4 pb-32">
<!-- Hero Section -->
<section class="flex flex-col items-center text-center mt-8 mb-10">
<div class="w-24 h-24 mb-6 relative">
<div class="absolute inset-0 bg-primary/10 rounded-full blur-2xl animate-pulse"></div>
<div class="relative bg-surface-container-lowest rounded-3xl p-6 shadow-sm flex items-center justify-center border border-outline-variant">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
</div>
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface mb-2 tracking-tight">Diagnóstico Completo</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">Mapeie suas habilidades linguísticas em minutos e crie seu plano personalizado.</p>
</section>
<!-- Skills Bento Grid -->
<section class="mb-10">
<div class="grid grid-cols-2 gap-3">
<!-- Skill Card 1 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-4 flex flex-col gap-3 hover:border-primary/50 transition-all card-shadow">
<span class="material-symbols-outlined text-tertiary" data-icon="record_voice_over">record_voice_over</span>

</div>
<!-- Skill Card 2 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-2xl p-4 flex flex-col gap-3 hover:border-primary/50 transition-all card-shadow">

<!-- Skill Card 3 -->

</div>
<!-- Skill Card 4 -->

<!-- Skill Card 6 -->

<span class="font-label-sm text-label-sm text-on-surface uppercase tracking-wider">Fluência</span>

                Começar

</button>
</div>

</button>

<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label-sm text-label-sm">Ajustes</span>

<script>
        // Micro-interactions
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.classList.add('opacity-80');
            });
            button.addEventListener('touchend', function() {
                this.classList.remove('opacity-80');
            });
        });

        // Add subtle animation to skill cards on load
        window.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.card-shadow');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(10px)';
                card.style.transition = 'all 0.4s ease-out';
                setTimeout(() => {
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, 100 + (index * 50));
            });
        });
    </script>
</body></html>
